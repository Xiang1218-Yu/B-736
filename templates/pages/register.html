{{define "content"}}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <h1 class="auth-title">{{T "auth.register_title"}}</h1>
            <form action="/register" method="POST" class="auth-form">
                {{csrfField}}
                <div class="form-group">
                    <label for="username">{{T "auth.username"}}</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="30" class="form-input" placeholder="{{T "auth.username_rule"}}">
                </div>
                <div class="form-group">
                    <label for="password">{{T "auth.password"}}</label>
                    <input type="password" id="password" name="password" required minlength="6" maxlength="50" class="form-input" placeholder="{{T "auth.password_rule"}}">
                </div>
                <div class="form-group">
                    <label for="confirm_password">{{T "auth.confirm_password"}}</label>
                    <input type="password" id="confirm_password" name="confirm_password" required class="form-input" placeholder="{{T "auth.confirm_placeholder"}}">
                </div>
                <button type="submit" class="btn btn-primary btn-block">{{T "auth.register_title"}}</button>
            </form>
            <p class="auth-footer">
                {{T "auth.has_account"}}<a href="/login">{{T "auth.login_now"}}</a>
            </p>
        </div>
    </div>
</section>
{{end}}
