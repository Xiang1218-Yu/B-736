{{define "content"}}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <h1 class="auth-title">{{T "auth.login_title"}}</h1>
            <form action="/login" method="POST" class="auth-form">
                {{csrfField}}
                <div class="form-group">
                    <label for="username">{{T "auth.username"}}</label>
                    <input type="text" id="username" name="username" required class="form-input" placeholder="{{T "auth.username_placeholder"}}">
                </div>
                <div class="form-group">
                    <label for="password">{{T "auth.password"}}</label>
                    <input type="password" id="password" name="password" required class="form-input" placeholder="{{T "auth.password_placeholder"}}">
                </div>
                <button type="submit" class="btn btn-primary btn-block">{{T "auth.login_title"}}</button>
            </form>
            <p class="auth-footer">
                {{T "auth.no_account"}}<a href="/register">{{T "auth.register_now"}}</a>
            </p>
        </div>
    </div>
</section>
{{end}}
